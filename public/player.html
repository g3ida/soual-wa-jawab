<!doctype html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0e1a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>سؤال وجواب — انضم للعبة</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="app player-app">

    <div id="joinScreen" class="join-screen">
      <div class="join-card">
        <div class="brand-logo">؟</div>
        <h1>سؤال وجواب</h1>
        <p class="sub">تمت دعوتك لجلسة اللعب<br>اكتب اسمك وانضم إلى المنافسة</p>
        <form id="joinForm" autocomplete="off">
          <input id="nameInput" class="input" type="text" placeholder="اكتب اسمك هنا..." maxlength="16" enterkeyhint="go">
          <div id="joinError" class="form-error hidden"></div>
          <button class="btn btn-primary btn-lg btn-block" id="joinBtn" type="submit" style="margin-top:16px">دخول الجلسة</button>
        </form>
        <div class="hint-line" style="margin-top:20px">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0"/><line x1="12" y1="17" x2="12" y2="22"/></svg>
          جهّزوا مكالمة صوتية جماعية للإجابة شفهياً
        </div>
      </div>
    </div>

    <div id="gameScreen" class="hidden" style="flex:1;display:flex;flex-direction:column;gap:12px">
      <header class="topbar player-topbar">
        <div class="topbar-side">
          <span class="avatar sm" id="meAvatar">؟</span>
          <span class="conn-status"><span class="dot" id="connDot"></span></span>
          <b id="meName" style="max-width:32vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">-</b>
        </div>
        <div class="topbar-side">
          <span class="chip gold num"><b id="meScore">0</b><span>نقطة</span></span>
          <button class="icon-btn" id="soundBtn" aria-label="الصوت"></button>
        </div>
      </header>
      <main class="stage" id="stage"></main>
    </div>

  </div>

  <div id="wheelOverlay" class="overlay hidden">
    <div class="wheel-stage">
      <div class="wheel-title" id="wheelTitle">عجلة الحظ تدور...</div>
      <div class="wheel-holder">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas"></canvas>
      </div>
      <div class="wheel-sub" id="wheelSub">سيتم اختيار لاعب للإجابة</div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/shared.js"></script>
  <script src="/js/wheel.js"></script>
  <script src="/js/player.js"></script>
</body>
</html>
